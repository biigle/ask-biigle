name: Lint PHP

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lint-php.yml'
      - '**.php'
      - 'phpstan.neon'
      - 'composer.json'
  pull_request:
    paths:
      - '.github/workflows/lint-php.yml'
      - '**.php'
      - 'phpstan.neon'
      - 'composer.json'

jobs:
  lint-php:

    runs-on: ubuntu-latest

    steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'

    - uses: actions/checkout@v1
      with:
        fetch-depth: 1

    # PHPStan needs the application the module extends, so core is checked out and
    # this repository is installed into it, just like in test.yml.
    - uses: actions/checkout@v1
      with:
        repository: biigle/core
        ref: master
        fetch-depth: 1
        path: core

    - name: Copy .env
      run: cp .env.example .env
      working-directory: ../core

    - name: Set testing key
      run: echo "APP_KEY=base64:STZFA4bQKDjE2mlpRPmsJ/okG0eCh4RHd9BghtZeYmQ=" >> .env
      working-directory: ../core

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --prefer-dist --ignore-platform-reqs
      working-directory: ../core

    - name: Install current repository
      run: |
        composer config repositories.module --json '{"type": "path", "url": "'${GITHUB_WORKSPACE}'", "options": {"symlink": false}}'
        composer require --no-ansi --no-interaction --no-scripts --ignore-platform-reqs ${GITHUB_REPOSITORY}:@dev
      working-directory: ../core

    - name: Run Linter
      run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress --error-format=github --configuration=vendor/${GITHUB_REPOSITORY}/phpstan.neon
      working-directory: ../core

  cs-php:

    runs-on: ubuntu-latest

    steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        tools: cs2pr

    - uses: actions/checkout@v1
      with:
        fetch-depth: 1

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --prefer-dist --ignore-platform-reqs

    - name: Run PHP-CS fixer and cs2pr
      run: composer fix -- -vvv --dry-run --format=checkstyle | cs2pr
